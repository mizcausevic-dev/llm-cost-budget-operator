apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: llmcostbudgets.finops.kineticgain.com
spec:
  group: finops.kineticgain.com
  names:
    kind: LLMCostBudget
    listKind: LLMCostBudgetList
    plural: llmcostbudgets
    singular: llmcostbudget
    shortNames:
      - budget
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Limit
          type: string
          jsonPath: .spec.monthlyLimitUSD
        - name: Spend
          type: string
          jsonPath: .status.observedSpendUSD
        - name: Used%
          type: integer
          jsonPath: .status.percentUsed
        - name: State
          type: string
          jsonPath: .status.state
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - monthlyLimitUSD
                - costSource
              properties:
                monthlyLimitUSD:
                  type: string
                  pattern: '^[0-9]+(\.[0-9]+)?$'
                warnThresholdPercent:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 80
                costSource:
                  type: object
                  required:
                    - configMapName
                    - key
                  properties:
                    configMapName:
                      type: string
                    key:
                      type: string
            status:
              type: object
              properties:
                observedSpendUSD:
                  type: string
                percentUsed:
                  type: integer
                state:
                  type: string
                  enum: [UnderBudget, Warning, OverBudget, Unknown]
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - reason
                      - message
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
